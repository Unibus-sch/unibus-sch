name: Spring Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/frontend-env.mjs'
      - 'scripts/staging-smoke.mjs'
      - 'scripts/staging-smoke.test.mjs'
      - 'scripts/verify-staging-smoke.mjs'
      - 'scripts/validate-env.mjs'
      - 'scripts/validate-env.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/spring-backend-ci.yml'
  push:
    branches:
      - main
      - feature/server-setting
    paths:
      - 'backend/**'
      - 'scripts/frontend-env.mjs'
      - 'scripts/staging-smoke.mjs'
      - 'scripts/staging-smoke.test.mjs'
      - 'scripts/verify-staging-smoke.mjs'
      - 'scripts/validate-env.mjs'
      - 'scripts/validate-env.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/spring-backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: spring-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Test and build Spring backend
        working-directory: backend
        run: ./gradlew clean test build --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend verification dependencies
        run: npm ci

      - name: Verify environment and staging smoke contracts
        run: |
          npm run test:env
          npm run test:staging-smoke
          npm run typecheck

      - name: Build frontend with isolated CI values
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-public-anon-placeholder
          VITE_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
          VITE_AUTH_API_BASE_URL: http://127.0.0.1:8080
          VITE_ADMIN_API_BASE_URL: http://127.0.0.1:8080
          VITE_DRIVER_API_BASE_URL: http://127.0.0.1:8080
          UNIBUS_DEPLOYMENT_ENV: development
        run: npm run build

      - name: Validate staging Compose without printing resolved values
        working-directory: backend
        run: docker compose --env-file .env.staging.example -f compose.staging.yaml config --quiet

      - name: Build immutable-candidate Docker image
        working-directory: backend
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            -t "unibus-backend:ci-${GITHUB_SHA}" .

      - name: Verify Docker metadata
        run: |
          test "$(docker image inspect "unibus-backend:ci-${GITHUB_SHA}" --format '{{.Config.User}}')" = unibus
          docker image inspect "unibus-backend:ci-${GITHUB_SHA}" \
            --format '{{json .Config.Healthcheck.Test}}' | grep -q '/actuator/health/readiness'

      - name: Block fixable critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: unibus-backend:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
