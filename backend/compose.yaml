services:
  api:
    build:
      context: .
    image: unibus-backend:local
    ports:
      - "8080:8080"
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-jdbc:postgresql://host.docker.internal:54322/postgres?sslmode=disable}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME:-postgres}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
